# Local preview with real SAPUI5 libs (alternative to `cds watch` + ui5.sap.com CDN)
specVersion: "3.1"
metadata:
  name: com.yury.ordermgmt.orders
type: application
framework:
  name: SAPUI5
  version: "1.136.0"
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.fe.templates
    - name: sap.ushell
    - name: themelib_sap_horizon
server:
  customMiddleware:
    - name: ui5-middleware-simpleproxy
      afterMiddleware: compression
      mountPath: /odata
      configuration:
        baseUri: http://localhost:4004/odata
