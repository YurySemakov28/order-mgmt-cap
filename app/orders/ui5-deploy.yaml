# Build for the HTML5 Application Repository (used by mta.yaml)
specVersion: "3.1"
metadata:
  name: com.yury.ordermgmt.orders
type: application
resources:
  configuration:
    propertiesFileSourceEncoding: UTF-8
builder:
  resources:
    excludes:
      - "/test/**"
      - "/localService/**"
  customTasks:
    - name: ui5-task-zipper
      afterTask: generateCachebusterInfo
      configuration:
        archiveName: orders
        additionalFiles:
          - xs-app.json
